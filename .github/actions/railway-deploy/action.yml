name: Railway deploy
description: >
  Deploy one taskflow service to Railway, either from source or from a pre-built GHCR image.

# Conventions this action assumes (same for every service):
#   Railway service name : taskflow-<service>-<railway_env>
#   Dockerfile path      : packages/<service>/Dockerfile
#   Pre-built image      : ghcr.io/<owner>/taskflow-<service>:<image_tag>
#
# There is no `sha` input by design. When image_tag is blank this action deploys
# whatever is in the current working directory, so the CALLER is responsible for
# checking out the commit it wants built (see actions/checkout in _deploy.yml).
# When image_tag is set the working directory is ignored entirely — which is why
# the callers treat `sha` and `image_tag` as mutually exclusive.

inputs:
  service:
    description: Service short name (server | client). Drives the Railway service name, image name and Dockerfile path.
    required: true
  railway_env:
    description: Railway environment name to deploy into (ci | dev | staging | production).
    required: true
  image_tag:
    description: |
      Normalized image tag from GHCR (e.g. sha-abc1234) produced by build-image.yml.
      Already undecorated by resolve-deploy-inputs — do NOT re-parse display forms here.
      When set, Railway deploys from the pre-built image; blank means build from source.
    required: false
    default: ''
  railway_token:
    description: Railway project token (Settings → Tokens in the Railway dashboard).
    required: true

runs:
  using: composite
  steps:
    # Deployment mode:
    #   image_tag set               → deploy from a pre-built GHCR image (produced by build-image.yml).
    #                                 A temporary directory with a minimal FROM-only Dockerfile is created
    #                                 so Railway pulls the image rather than building from source.
    #   image_tag blank or sentinel → Railway builds the Docker image itself via the Dockerfile (default).
    # Access preflight. Separates "the credential is wrong" from "the deploy itself
    # failed" — without it an auth failure surfaces only as a bare Railway error
    # after ~10s of npm output, indistinguishable from a deploy problem.
    - name: Check Railway access (${{ inputs.service }})
      shell: bash
      env:
        RAILWAY_TOKEN: ${{ inputs.railway_token }}
        SERVICE: ${{ inputs.service }}
        RAILWAY_ENV: ${{ inputs.railway_env }}
      run: |
        # A missing secret is a hard failure: it means the token never reached this
        # action, which is a wiring bug rather than a credential problem.
        if [ -z "${RAILWAY_TOKEN:-}" ]; then
          echo "::error::RAILWAY_TOKEN is empty — the secret did not reach this action."
          echo "Check that the calling job declares the right 'environment:' and that"
          echo "RAILWAY_TOKEN is set on that GitHub Environment."
          exit 1
        fi
        TARGET="taskflow-${SERVICE}-${RAILWAY_ENV}"
        # TEMPORARY DIAGNOSTIC. The last-4 fingerprint only proved 4 of 36 chars, so a
        # value with the right length and right suffix but a wrong character in the
        # middle looked identical. A truncated SHA-256 compares ALL 36 characters and
        # leaks nothing: 12 hex chars is 48 bits, useless for recovering a UUID.
        # Compare locally with:
        #   printf '%s' '<token>' | shasum -a 256 | cut -c1-12     # macOS
        #   printf '%s' '<token>' | sha256sum     | cut -c1-12     # Linux
        # Remove once staging is green.
        TOKEN_HASH=$(printf '%s' "$RAILWAY_TOKEN" | sha256sum | cut -c1-12)
        echo "RAILWAY_TOKEN present: ${#RAILWAY_TOKEN} chars, sha256 ${TOKEN_HASH}"

        # If the hash matches but Railway still rejects it, the value is right and
        # something else on the runner is interfering — so surface that here too.
        echo "RAILWAY_* variables visible on this runner (values redacted):"
        env | grep -i '^RAILWAY' | sed 's/=.*/=<redacted>/' | sed 's/^/  /' || true
        echo "Expecting service '${TARGET}' in Railway environment '${RAILWAY_ENV}'."

        # TEMPORARY FORENSICS. Three recently-minted tokens have been rejected from
        # the runner while two older ones work, and one of the rejected tokens was
        # byte-verified identical to a value that authenticates from a laptop. So
        # capture what actually differs: CLI build, raw API verdict, egress IP.
        echo "--- railway CLI version on this runner ---"
        npx --yes @railway/cli@latest --version 2>&1 | sed 's/^/  /' || true

        # Hit Railway's API directly, bypassing the CLI entirely. This separates
        # "the CLI cannot authenticate" from "Railway rejects this credential".
        # Only the HTTP status is printed — never the token or the response body.
        echo "--- raw Railway API auth probe (project-token header) ---"
        API_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
          -X POST https://backboard.railway.app/graphql/v2 \
          -H 'Content-Type: application/json' \
          -H "Project-Access-Token: ${RAILWAY_TOKEN}" \
          -d '{"query":"query { __typename }"}' || echo "000")
        echo "  HTTP ${API_CODE}  (200 = credential accepted, 401/403 = rejected, 000 = unreachable)"

        echo "--- runner egress IP (for a Railway support ticket) ---"
        curl -s --max-time 10 https://api.ipify.org 2>/dev/null | sed 's/^/  /' || echo "  (unavailable)"
        echo ""

        # `railway status` is the only probe worth running: it resolves the token to a
        # workspace/project/environment and lists the services it can actually see.
        #
        # Do NOT add `railway whoami` here. Project tokens are not tied to a user
        # account, so it reports "Unauthorized. Please check that your RAILWAY_TOKEN
        # is valid..." for tokens that deploy perfectly well — wording almost
        # identical to a genuine auth failure, which sends debuggers the wrong way.
        if ! STATUS=$(npx --yes @railway/cli@latest status 2>&1); then
          echo "$STATUS" | sed 's/^/  /'
          echo "::error::railway status failed for environment '${RAILWAY_ENV}' — the token"
          echo "is not accepted by Railway. Compare the fingerprint above with Railway ->"
          echo "Project Settings -> Tokens; if it differs, the secret holds a stale value."
          exit 1
        fi
        echo "$STATUS" | sed 's/^/  /'

        # Catches a renamed or deleted service before the deploy reports it obliquely.
        if ! printf '%s' "$STATUS" | grep -qF "$TARGET"; then
          echo "::warning::Service '${TARGET}' was not listed by railway status —"
          echo "it may have been renamed or removed in the '${RAILWAY_ENV}' environment."
        fi

    - name: Deploy ${{ inputs.service }} to Railway
      shell: bash
      env:
        RAILWAY_TOKEN: ${{ inputs.railway_token }}
        # Pass user-controlled values via env: so they are never interpolated
        # directly into the shell script — prevents quote-breaking and command injection.
        IMAGE_TAG: ${{ inputs.image_tag }}
        SERVICE: ${{ inputs.service }}
        RAILWAY_ENV: ${{ inputs.railway_env }}
        REPO_OWNER: ${{ github.repository_owner }}
      run: |
        OWNER=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
        if [ -n "$IMAGE_TAG" ]; then
          if ! printf '%s' "$IMAGE_TAG" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'; then
            echo "Invalid image_tag '$IMAGE_TAG' (allowed: letters, numbers, ., _, -)"; exit 1
          fi
          IMAGE="ghcr.io/${OWNER}/taskflow-${SERVICE}:${IMAGE_TAG}"
          echo "Deploying pre-built image ${IMAGE} → ${RAILWAY_ENV}..."
          DEPLOY_DIR=$(mktemp -d)
          # Railway is configured with Dockerfile path 'packages/<service>/Dockerfile'.
          # The uploaded context must contain a file at that exact path.
          mkdir -p "$DEPLOY_DIR/packages/${SERVICE}"
          echo "FROM ${IMAGE}" > "$DEPLOY_DIR/packages/${SERVICE}/Dockerfile"
          cd "$DEPLOY_DIR"
        else
          echo "Deploying from source for taskflow-${SERVICE}-${RAILWAY_ENV} → ${RAILWAY_ENV}..."
        fi
        # --detach is intentionally omitted: railway up blocks until Railway confirms
        # the new deployment is live, so the caller's health check is guaranteed to test
        # the new instance rather than the still-running old one.
        npx --yes @railway/cli@latest up \
          --service "taskflow-${SERVICE}-${RAILWAY_ENV}" \
          --environment "$RAILWAY_ENV"
        echo "${SERVICE} deploy complete."
