name: Deploy (reusable)

# This reusable workflow is the single source of deploy logic.
# All environment-specific deploy workflows call this one.
#
# Hosting: Railway
# Secrets: managed by dotenv-vault — only RAILWAY_TOKEN is required here.
#
# To switch hosting providers, only update this file.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment name (dev | staging | production)
        required: true
        type: string
      railway_env:
        description: Railway environment name to deploy into (dev | staging | production)
        required: true
        type: string
      sha:
        description: Full commit SHA to deploy (defaults to HEAD of the triggering branch)
        required: false
        type: string
        default: ''
      image_tag:
        description: |
          Pre-built image tag from GHCR (e.g. sha-abc1234) produced by build-image.yml.
          When set, Railway deploys from the pre-built image instead of building from source.
          Leave blank to use the default source-build behaviour.
        required: false
        type: string
        default: ''
    secrets:
      RAILWAY_TOKEN:
        description: Railway project token (Settings → Tokens in Railway dashboard)
        required: true

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.ref }}
          fetch-depth: 0

      # Deployment mode:
      #   image_tag set  → deploy from a pre-built GHCR image (produced by build-image.yml).
      #                    A temporary directory with a minimal FROM-only Dockerfile is created
      #                    so Railway pulls the image rather than building from source.
      #   image_tag blank → Railway builds the Docker image itself via the Dockerfile (default).

      - name: Deploy server to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG='${{ inputs.image_tag }}'
          if [ -n "$IMAGE_TAG" ]; then
            if ! printf '%s' "$IMAGE_TAG" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'; then
              echo "Invalid image_tag '$IMAGE_TAG' (allowed: letters, numbers, ., _, -)"; exit 1
            fi
            echo "Deploying pre-built image ghcr.io/${OWNER}/taskflow-server:${IMAGE_TAG} → ${{ inputs.railway_env }}..."
            DEPLOY_DIR=$(mktemp -d)
            echo "FROM ghcr.io/${OWNER}/taskflow-server:${IMAGE_TAG}" > "$DEPLOY_DIR/Dockerfile"
            cd "$DEPLOY_DIR"
          else
            echo "Deploying from source for taskflow-server-${{ inputs.railway_env }} → ${{ inputs.railway_env }}..."
          fi
          npx --yes @railway/cli@latest up \
            --service taskflow-server-${{ inputs.railway_env }} \
            --environment ${{ inputs.railway_env }} \
            --detach
          echo "Server deploy triggered."

      - name: Deploy client to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "Deploying pre-built image ghcr.io/${OWNER}/taskflow-client:${{ inputs.image_tag }} → ${{ inputs.railway_env }}..."
            DEPLOY_DIR=$(mktemp -d)
            echo "FROM ghcr.io/${OWNER}/taskflow-client:${{ inputs.image_tag }}" > "$DEPLOY_DIR/Dockerfile"
            cd "$DEPLOY_DIR"
          else
            echo "Deploying from source for taskflow-client-${{ inputs.railway_env }} → ${{ inputs.railway_env }}..."
          fi
          npx --yes @railway/cli@latest up \
            --service taskflow-client-${{ inputs.railway_env }} \
            --environment ${{ inputs.railway_env }} \
            --detach
          echo "Client deploy triggered."

      - name: Health check (server)
        run: |
          echo "Waiting 15 seconds for Railway to build and start the container..."
          sleep 15
          DEADLINE=$(( $(date +%s) + 180 ))  # poll for up to 3 more minutes (4 min total)
          INTERVAL=5
          BASE_URL="${{ vars.SERVER_URL }}"
          BASE_URL="${BASE_URL%/}"  # strip any trailing slash
          while true; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${BASE_URL}/health" || echo "000")
            echo "Health check ${BASE_URL}/health → $STATUS ($(( DEADLINE - $(date +%s) ))s remaining)"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed."
              exit 0
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "❌ Health check timed out after 4 minutes — last status: $STATUS"
              exit 1
            fi
            sleep $INTERVAL
          done

      - name: Summary
        run: |
          echo "## Deploy to ${{ inputs.environment }} complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Railway env** | ${{ inputs.railway_env }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${{ inputs.sha || github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image tag** | ${{ inputs.image_tag || '(built from source)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Client URL** | ${{ vars.CLIENT_URL }} |" >> $GITHUB_STEP_SUMMARY

  notify-pr:
    name: Notify PR
    needs: deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    if: ${{ always() }}
    steps:
      - name: Comment deploy status on PR
        uses: actions/github-script@v7
        with:
          script: |
            // inputs.sha is set for staging/production (manual); fall back to context.sha for ci (push)
            const sha = '${{ inputs.sha }}' || context.sha;
            const status = '${{ needs.deploy.result }}';
            const emoji = status === 'success' ? '✅' : '❌';
            const env = '${{ inputs.environment }}';
            const body = `${emoji} **${env} deploy** ${status} for \`${sha.slice(0,7)}\`\n\nEnvironment: ${env} | [View app](${{ vars.CLIENT_URL }})`;

            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
            });

            for (const pr of prs.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }

      - name: Label PR with deployed environment
        uses: actions/github-script@v7
        if: ${{ needs.deploy.result == 'success' }}
        with:
          script: |
            // inputs.sha is set for staging/production (manual); fall back to context.sha for ci (push)
            const sha = '${{ inputs.sha }}' || context.sha;
            const env = '${{ inputs.environment }}';

            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
            });

            // Ensure the environment label exists with the correct color before applying it.
            // Colors: ci=blue, dev=yellow, staging=green, production=red.
            const labelColors = { ci: '0075ca', dev: 'e4e669', staging: '0e8a16', production: 'd93f0b' };
            const labelName = `deployed: ${env}`;
            const labelColor = labelColors[env] ?? 'ededed';
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
                color: labelColor,
                description: `Deployed to ${env}`,
              });
            } catch (e) {
              if (e.status === 422) {
                // Label already exists — update it to ensure color and description stay in sync.
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName,
                  color: labelColor,
                  description: `Deployed to ${env}`,
                });
              } else {
                throw e;
              }
            }

            for (const pr of prs.data) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [labelName],
              });
            }
