name: Deploy (reusable)

# This reusable workflow is the single source of deploy logic.
# All environment-specific deploy workflows call this one.
#
# Hosting: Railway
# Secrets: managed by dotenv-vault — only RAILWAY_TOKEN is required here.
#
# To switch hosting providers, only update this file.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment name (dev | staging | production)
        required: true
        type: string
      railway_env:
        description: Railway environment name to deploy into (dev | staging | production)
        required: true
        type: string
      image_tag:
        description: |
          Normalized pre-built image tag from GHCR (e.g. sha-abc1234), as produced by
          build-image.yml and undecorated by the resolve-deploy-inputs action.
          When set, Railway deploys from the pre-built image; blank means build from source.
          Callers must pass a clean tag — display forms like "sha-abc1234 (2026-06-07)"
          and the "(build from source)" sentinel are NOT accepted here.
        required: false
        type: string
        default: ''
      sha:
        description: Full commit SHA to build from (only used when image_tag is blank or "(build from source)")
        required: false
        type: string
        default: ''
    secrets:
      RAILWAY_TOKEN:
        description: Railway project token (Settings → Tokens in Railway dashboard)
        required: true

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.ref }}
          fetch-depth: 0

      # The per-service deploy logic (source vs pre-built image) lives in the local
      # composite action so server and client cannot drift apart.
      - name: Deploy server to Railway
        uses: ./.github/actions/railway-deploy
        with:
          service: server
          railway_env: ${{ inputs.railway_env }}
          image_tag: ${{ inputs.image_tag }}
          railway_token: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy client to Railway
        uses: ./.github/actions/railway-deploy
        with:
          service: client
          railway_env: ${{ inputs.railway_env }}
          image_tag: ${{ inputs.image_tag }}
          railway_token: ${{ secrets.RAILWAY_TOKEN }}

      - name: Health check (server)
        run: |
          # railway up (without --detach) already confirmed the new deployment is live.
          # This step is a final HTTP smoke test to verify the endpoint is reachable
          # from the GitHub Actions runner and returns a healthy response.
          DEADLINE=$(( $(date +%s) + 60 ))  # allow up to 1 minute for DNS/LB propagation
          INTERVAL=5
          BASE_URL="${{ vars.SERVER_URL }}"
          BASE_URL="${BASE_URL%/}"  # strip any trailing slash
          while true; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${BASE_URL}/health" || echo "000")
            echo "Health check ${BASE_URL}/health → $STATUS ($(( DEADLINE - $(date +%s) ))s remaining)"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed."
              exit 0
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "❌ Health check timed out — last status: $STATUS"
              exit 1
            fi
            sleep $INTERVAL
          done

      - name: Summary
        run: |
          echo "## Deploy to ${{ inputs.environment }} complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Railway env** | ${{ inputs.railway_env }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${{ inputs.sha || github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image tag** | ${{ inputs.image_tag || '(built from source)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Client URL** | ${{ vars.CLIENT_URL }} |" >> $GITHUB_STEP_SUMMARY

  notify-pr:
    name: Notify PR
    needs: deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    if: ${{ always() }}
    steps:
      - name: Comment deploy status on PR
        uses: actions/github-script@v7
        with:
          script: |
            // inputs.sha is set for staging/production (manual); fall back to context.sha for ci (push)
            const sha = '${{ inputs.sha }}' || context.sha;
            const status = '${{ needs.deploy.result }}';
            const emoji = status === 'success' ? '✅' : '❌';
            const env = '${{ inputs.environment }}';
            const body = `${emoji} **${env} deploy** ${status} for \`${sha.slice(0,7)}\`\n\nEnvironment: ${env} | [View app](${{ vars.CLIENT_URL }})`;

            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
            });

            for (const pr of prs.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }

      - name: Label PR with deployed environment
        uses: actions/github-script@v7
        if: ${{ needs.deploy.result == 'success' }}
        with:
          script: |
            // inputs.sha is set for staging/production (manual); fall back to context.sha for ci (push)
            const sha = '${{ inputs.sha }}' || context.sha;
            const env = '${{ inputs.environment }}';

            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
            });

            // Ensure the environment label exists with the correct color before applying it.
            // Colors: ci=blue, dev=yellow, staging=green, production=red.
            const labelColors = { ci: '0075ca', dev: 'e4e669', staging: '0e8a16', production: 'd93f0b' };
            const labelName = `deployed: ${env}`;
            const labelColor = labelColors[env] ?? 'ededed';
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
                color: labelColor,
                description: `Deployed to ${env}`,
              });
            } catch (e) {
              if (e.status === 422) {
                // Label already exists — update it to ensure color and description stay in sync.
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName,
                  color: labelColor,
                  description: `Deployed to ${env}`,
                });
              } else {
                throw e;
              }
            }

            for (const pr of prs.data) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [labelName],
              });
            }
