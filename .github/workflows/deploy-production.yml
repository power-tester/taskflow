name: Deploy → Production
# Manual promotion with a required reviewer approval gate.
#
# Setup: GitHub → Settings → Environments → "production"
#   - Add required reviewers
#   - (Optional) Add protection rules: only allow deploys from main branch
#
# This workflow will pause at the "Deploy to Production" job and wait for
# approval before proceeding.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Pre-built image tag to deploy (defaults to latest).
        required: false
        default: 'latest'
        type: choice
        options:
          ['sha-35fc996 (2026-06-06)', 'sha-92bf788 (2026-06-06)', 'latest', '(build from source)']
      sha:
        description: Commit SHA to build from (only used when image tag is "(build from source)")
        required: false
        default: ''
      release_notes:
        description: Short release notes (used for the GitHub Release)
        required: false
        default: ''
permissions:
  pull-requests: write
  contents: write # needed for create-release
jobs:
  validate-inputs:
    name: Validate inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check for conflicting inputs
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          SHA: ${{ inputs.sha }}
        run: |
          # Strip date suffix so "sha-abc1234 (2026-06-06)" is treated as a real tag.
          IMAGE_TAG="${IMAGE_TAG% (*}"
          # sha + a real image_tag are mutually exclusive: sha pins the source checkout
          # but image_tag deploys a pre-built image and ignores the checked-out source.
          if [ -n "$SHA" ] && [ -n "$IMAGE_TAG" ] && [ "$IMAGE_TAG" != "(build from source)" ]; then
            echo "Error: both 'sha' and 'image_tag' were supplied."
            echo "These inputs are mutually exclusive: 'sha' pins the source checkout,"
            echo "but 'image_tag' deploys a pre-built image and ignores the source entirely."
            echo "Supply one or the other, not both."
            exit 1
          fi

  checkout-sha:
    needs: validate-inputs
    name: Resolve SHA
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - id: resolve
        run: |
          if [ -n "${{ inputs.sha }}" ]; then
            git checkout ${{ inputs.sha }}
          fi
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "short_sha=${SHA:0:7}" >> $GITHUB_OUTPUT
  deploy-production:
    needs: checkout-sha
    name: Deploy to Production
    # ← This references the GitHub Environment "production".
    # GitHub will pause here and require reviewer approval before continuing.
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      railway_env: production
      sha: ${{ needs.checkout-sha.outputs.sha }}
      image_tag: ${{ inputs.image_tag }}
    secrets:
      # Set in GitHub → Settings → Environments → production → Secrets
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  create-release:
    needs: [checkout-sha, deploy-production]
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: success()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.checkout-sha.outputs.sha }}
      - name: Generate tag name
        id: tag
        run: |
          TAG="v$(date +'%Y.%m.%d')-${{ needs.checkout-sha.outputs.short_sha }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ needs.checkout-sha.outputs.sha }}';
            const tag = '${{ steps.tag.outputs.tag }}';
            const notes = `${{ inputs.release_notes }}` || `Production deploy of ${sha.slice(0,7)}`;

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: sha,
              name: tag,
              body: notes,
              draft: false,
              prerelease: false,
            });
            console.log(`Release ${tag} created.`);
