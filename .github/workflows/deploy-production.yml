name: Deploy → Production
# Manual promotion with a required reviewer approval gate.
#
# Setup: GitHub → Settings → Environments → "production"
#   - Add required reviewers
#   - (Optional) Add protection rules: only allow deploys from main branch
#
# This workflow will pause at the "Deploy to Production" job and wait for
# approval before proceeding.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Pre-built image tag to deploy (defaults to latest).
        required: false
        default: 'latest'
        type: choice
        options: ["latest", "(build from source)", "sha-009a922 (2026-08-20)", "sha-35fc996 (2026-06-06)", "sha-92bf788 (2026-06-06)", "sha-c280978 (2026-06-07)"]
      sha:
        description: Commit SHA to build from (only used when image tag is "(build from source)")
        required: false
        default: ''
      release_notes:
        description: Short release notes (used for the GitHub Release)
        required: false
        default: ''
permissions:
  pull-requests: write
  contents: write # needed for create-release
jobs:
  resolve:
    name: Validate & resolve inputs
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
    steps:
      # fetch-depth: 0 so resolve-deploy-inputs can rev-parse a short SHA from a sha-* tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - id: resolve
        uses: ./.github/actions/resolve-deploy-inputs
        with:
          # RAW dispatch input — the resolve action is what normalizes it.
          image_tag: ${{ inputs.image_tag }}
          sha: ${{ inputs.sha }}
  deploy-production:
    needs: resolve
    name: Deploy to Production
    # ← This references the GitHub Environment "production".
    # GitHub will pause here and require reviewer approval before continuing.
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      railway_env: production
      sha: ${{ needs.resolve.outputs.sha }}
      image_tag: ${{ needs.resolve.outputs.image_tag }}
    secrets:
      # Set in GitHub → Settings → Environments → production → Secrets
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  create-release:
    needs: [resolve, deploy-production]
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: success()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Generate tag name
        id: tag
        run: |
          TAG="v$(date +'%Y.%m.%d')-${{ needs.resolve.outputs.short_sha }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ needs.resolve.outputs.sha }}';
            const tag = '${{ steps.tag.outputs.tag }}';
            const notes = `${{ inputs.release_notes }}` || `Production deploy of ${sha.slice(0,7)}`;

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: sha,
              name: tag,
              body: notes,
              draft: false,
              prerelease: false,
            });
            console.log(`Release ${tag} created.`);
