name: Deploy → Staging
# Manual promotion. Specify the commit SHA to deploy (defaults to HEAD of main).
# Typical use: after QA in dev signs off, engineer manually runs this workflow.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Pre-built image tag to deploy (defaults to latest).
        required: false
        default: 'latest'
        type: choice
        options:
          ['sha-35fc996 (2026-06-06)', 'sha-92bf788 (2026-06-06)', 'latest', '(build from source)']
      sha:
        description: Commit SHA to build from (only used when image tag is "(build from source)")
        required: false
        default: ''
permissions:
  pull-requests: write
jobs:
  validate-inputs:
    name: Validate inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check for conflicting inputs
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          SHA: ${{ inputs.sha }}
        run: |
          # Strip date suffix so "sha-abc1234 (2026-06-06)" is treated as a real tag.
          IMAGE_TAG="${IMAGE_TAG% (*}"
          # sha + a real image_tag are mutually exclusive: sha pins the source checkout
          # but image_tag deploys a pre-built image and ignores the checked-out source.
          if [ -n "$SHA" ] && [ -n "$IMAGE_TAG" ] && [ "$IMAGE_TAG" != "(build from source)" ]; then
            echo "Error: both 'sha' and 'image_tag' were supplied."
            echo "These inputs are mutually exclusive: 'sha' pins the source checkout,"
            echo "but 'image_tag' deploys a pre-built image and ignores the source entirely."
            echo "Supply one or the other, not both."
            exit 1
          fi

  checkout-sha:
    needs: validate-inputs
    name: Resolve SHA
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - id: resolve
        run: |
          IMAGE_TAG="${{ inputs.image_tag }}"
          # Strip date suffix: "sha-abc1234 (2026-06-06)" → "sha-abc1234"
          IMAGE_TAG="${IMAGE_TAG% (*}"
          # If image_tag is a sha- tag, derive the commit SHA from it so deploy
          # summaries and PR notifications point at the exact commit the image was built from.
          SHORT_SHA_FROM_TAG=$(echo "$IMAGE_TAG" | sed -n 's/^sha-\([a-f0-9]*\).*/\1/p')
          if [ -n "$SHORT_SHA_FROM_TAG" ]; then
            SHA=$(git rev-parse "$SHORT_SHA_FROM_TAG")
          elif [ -n "${{ inputs.sha }}" ]; then
            git checkout ${{ inputs.sha }}
            SHA=$(git rev-parse HEAD)
          else
            SHA=$(git rev-parse HEAD)
          fi
          echo "sha=$SHA" >> $GITHUB_OUTPUT
  deploy-staging:
    needs: checkout-sha
    name: Deploy to Staging
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
      railway_env: staging
      sha: ${{ needs.checkout-sha.outputs.sha }}
      image_tag: ${{ inputs.image_tag }}
    secrets:
      # Set in GitHub → Settings → Environments → staging → Secrets
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
