name: Deploy → Staging
# Manual promotion. Pick a pre-built image tag (defaults to latest), or choose
# "(build from source)" and give a commit SHA (defaults to HEAD of main).
# Typical use: after QA in ci signs off, an engineer manually runs this workflow.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Pre-built image tag to deploy (defaults to latest).
        required: false
        default: 'latest'
        type: choice
        options: ["latest", "(build from source)", "sha-37061e3 (2026-10-10)", "sha-009a922 (2026-08-20)", "sha-1909e05 (2026-08-22)", "sha-35fc996 (2026-06-06)", "sha-3f7f336 (2026-08-22)", "sha-7419299 (2026-08-22)", "sha-92bf788 (2026-06-06)", "sha-93369fd (2026-08-22)", "sha-993599a (2026-08-20)", "sha-bdbd07a (2026-08-20)"]
      sha:
        description: Commit SHA to build from (only used when image tag is "(build from source)")
        required: false
        default: ''
permissions:
  contents: read # actions/checkout in the resolve job and in the shared deploy workflow
  pull-requests: write # notify-pr comments on and labels the associated PR
  packages: read # resolve-deploy-inputs reads GHCR metadata to resolve moving tags
jobs:
  resolve:
    name: Validate & resolve inputs
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
    steps:
      # fetch-depth: 0 so resolve-deploy-inputs can rev-parse a short SHA from a sha-* tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - id: resolve
        uses: power-tester/deploy-workflows/.github/actions/resolve-deploy-inputs@v1
        with:
          # RAW dispatch input — the resolve action is what normalizes it.
          image_tag: ${{ inputs.image_tag }}
          sha: ${{ inputs.sha }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
  deploy-staging:
    needs: resolve
    name: Deploy to Staging
    # The deploy pipeline itself lives in power-tester/deploy-workflows; this
    # workflow only supplies the environment-specific inputs and the token.
    uses: power-tester/deploy-workflows/.github/workflows/deploy.yml@v1
    with:
      environment: staging
      railway_env: staging
      # server and client have no ordering relationship, so deploy them concurrently.
      max_parallel: 2
      sha: ${{ needs.resolve.outputs.sha }}
      image_tag: ${{ needs.resolve.outputs.image_tag }}
    secrets:
      # Set in GitHub → Settings → Environments → staging → Secrets
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
