name: Deploy → Staging
# Manual promotion. Specify the commit SHA to deploy (defaults to HEAD of main).
# Typical use: after QA in dev signs off, engineer manually runs this workflow.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Pre-built image tag to deploy (defaults to latest).
        required: false
        default: 'latest'
        type: choice
        options: ["latest", "(build from source)", "sha-e0051c3 (2026-08-22)", "sha-009a922 (2026-08-20)", "sha-35fc996 (2026-06-06)", "sha-3f7f336 (2026-08-22)", "sha-92bf788 (2026-06-06)", "sha-993599a (2026-08-20)", "sha-bdbd07a (2026-08-20)", "sha-c280978 (2026-06-07)", "sha-f83630a (2026-08-20)", "sha-fb3f6ae (2026-08-20)"]
      sha:
        description: Commit SHA to build from (only used when image tag is "(build from source)")
        required: false
        default: ''
permissions:
  contents: read # actions/checkout in the resolve job and in _deploy.yml
  pull-requests: write # notify-pr comments on and labels the associated PR
  packages: read # resolve-deploy-inputs reads GHCR metadata to resolve moving tags
jobs:
  resolve:
    name: Validate & resolve inputs
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
    steps:
      # fetch-depth: 0 so resolve-deploy-inputs can rev-parse a short SHA from a sha-* tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - id: resolve
        uses: ./.github/actions/resolve-deploy-inputs
        with:
          # RAW dispatch input — the resolve action is what normalizes it.
          image_tag: ${{ inputs.image_tag }}
          sha: ${{ inputs.sha }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
  deploy-staging:
    needs: resolve
    name: Deploy to Staging
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
      railway_env: staging
      sha: ${{ needs.resolve.outputs.sha }}
      image_tag: ${{ needs.resolve.outputs.image_tag }}
    secrets:
      # Set in GitHub → Settings → Environments → staging → Secrets
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
