name: Deploy → Staging
# Manual promotion. Specify the commit SHA to deploy (defaults to HEAD of main).
# Typical use: after QA in dev signs off, engineer manually runs this workflow.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to deploy (defaults to HEAD of main)
        required: false
        default: ''
      image_tag:
        description:
          Pre-built image tag to deploy. Recent tags (newest first): sha-440e91c (2026-06-06), sha-13d9718 (2026-06-06), sha-4814325 (2026-06-06), sha-4c3abdb (2026-06-06), sha-e4a2b0d (2026-06-06). Pick 'latest' for the most recent build, or '(build from source)' to build from source.
        required: false
        default: 'sha-440e91c'
        type: choice
        options: ["sha-440e91c", "sha-13d9718", "sha-4814325", "sha-4c3abdb", "sha-e4a2b0d", "latest", "(build from source)"]
permissions:
  pull-requests: write
jobs:
  checkout-sha:
    name: Resolve SHA
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - id: resolve
        run: |
          if [ -n "${{ inputs.sha }}" ]; then
            git checkout ${{ inputs.sha }}
          fi
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
  deploy-staging:
    needs: checkout-sha
    name: Deploy to Staging
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
      railway_env: staging
      sha: ${{ needs.checkout-sha.outputs.sha }}
      image_tag: ${{ inputs.image_tag }}
    secrets:
      # Set in GitHub → Settings → Environments → staging → Secrets
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
