name: Build & Publish Docker Images

# Runs on every merge to main (after trunk-based delivery lands).
# Builds the production Docker images for server and client and pushes them
# to GitHub Container Registry (ghcr.io) so they can be used as pre-built
# artifacts for staging and production deploys.
#
# Image naming convention:
#   ghcr.io/<owner>/taskflow-server:<tag>
#   ghcr.io/<owner>/taskflow-client:<tag>
#
# Tags produced per build:
#   sha-<short-sha>  — immutable; use this tag when triggering a deploy
#   latest           — always points to the most recent main build
#
# After this workflow completes, copy the printed image tag and supply it as
# the "image_tag" input when manually dispatching deploy-staging.yml or
# deploy-production.yml to skip Railway's source build step.
#
# Note: GHCR packages must be set to public (or Railway must be granted
# registry access) for Railway to pull the image at deploy time.

on:
  push:
    branches: [main]

permissions:
  contents: write # write needed so the update-deploy-options job can commit workflow changes
  packages: write # needed to push to ghcr.io

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      already_built: ${{ steps.check_existing.outputs.exists }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag and registry owner
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT

      - name: Check if image tag already exists in GHCR
        id: check_existing
        run: |
          OWNER="${{ steps.meta.outputs.owner }}"
          TAG="${{ steps.meta.outputs.tag }}"
          # Only skip the full build when BOTH server AND client tags are present.
          # If a previous run pushed server but failed before pushing client, we must
          # rebuild both to avoid deploying a mismatched pair.
          if docker manifest inspect "ghcr.io/${OWNER}/taskflow-server:${TAG}" > /dev/null 2>&1 && \
             docker manifest inspect "ghcr.io/${OWNER}/taskflow-client:${TAG}" > /dev/null 2>&1; then
            echo "Both images for ${TAG} already exist in GHCR — skipping build."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "One or both images for ${TAG} not found — proceeding with build."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build & push server image
        if: steps.check_existing.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/taskflow-server:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/taskflow-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push client image
        if: steps.check_existing.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/client/Dockerfile
          target: production
          build-args: |
            VITE_APP_ENV=production
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/taskflow-client:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/taskflow-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          OWNER="${{ steps.meta.outputs.owner }}"
          TAG="${{ steps.meta.outputs.tag }}"
          if [ "${{ steps.check_existing.outputs.exists }}" = "true" ]; then
            echo "## Docker Images Already Published (skipped rebuild)" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Docker Images Published" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| \`ghcr.io/${OWNER}/taskflow-server\` | \`${TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`ghcr.io/${OWNER}/taskflow-client\` | \`${TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The deploy workflow option lists will be updated automatically by the next job." >> $GITHUB_STEP_SUMMARY

  # After images are pushed, refresh the image_tag dropdown options in the two
  # manual deploy workflows so engineers always see an up-to-date list of tags.
  update-deploy-options:
    name: Refresh image_tag options in deploy workflows
    needs: build-and-push
    # Skip if the image was already present — the options list won't have changed.
    if: needs.build-and-push.outputs.already_built != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/create-github-app-token only needs read on contents
      packages: read # read GHCR package metadata to list available tags

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          # Store the App ID as an org-level Actions variable scoped to selected repositories.
          app-id: ${{ vars.WORKFLOW_APP_ID }}
          # Store the private key PEM as an org-level Actions secret scoped to selected repositories.
          private-key: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
        # The action mints a short-lived installation token (expires in 1 h).
        # The token is scoped to this repository and inherits only the permissions
        # granted to the GitHub App installation (Contents: write, Workflows: write).
        # See docs/GITHUB_APP_SERVICE_TOKEN.md for setup instructions and rationale.

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
        # Loop-avoidance: pushes made with an App token can re-trigger push workflows,
        # but the commit message includes "[skip ci]" which tells GitHub Actions to
        # skip workflow runs for that push.

      - name: Install yq (mikefarah v4)
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Fetch all available sha- tags from GHCR
        id: fetch_tags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          NEW_TAG="${{ needs.build-and-push.outputs.image_tag }}"

          # Query GHCR for all published versions of taskflow-server.
          # Both images (server + client) share the same sha- tags, so one query suffices.
          # --fail-with-body makes curl exit non-zero on HTTP 4xx/5xx so build failures
          # are not silently swallowed and mistakenly treated as an empty tag list.
          RAW=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${OWNER}/packages/container/taskflow-server/versions?per_page=100")

          # Build {tag, date} objects sorted newest-first from GHCR API response.
          TAGGED_OBJS=$(echo "$RAW" | jq -c \
            'sort_by(.created_at) | reverse
             | [ .[] | select(.metadata.container.tags | map(startswith("sha-")) | any)
               | { tag: (.metadata.container.tags[] | select(startswith("sha-"))),
                   date: .created_at[0:10] } ]
             | unique_by(.tag)')

          # Always force NEW_TAG to be first in the options — the GHCR API may not have
          # propagated it yet immediately after the push (eventual consistency).
          # Without this, the type:choice default would not be present in options,
          # causing manual workflow dispatch to fail.
          TODAY=$(date -u +%F)
          BASE=$(echo "$TAGGED_OBJS" | jq -c \
            --arg newtag "$NEW_TAG" \
            --arg today "$TODAY" \
            '(
               (map(select(.tag == $newtag))
                | if length == 0 then [{ tag: $newtag, date: $today }] else . end)
               + map(select(.tag != $newtag))
             )
             | .[0:10]')

          # Options dropdown: tags shown as "sha-abc1234 (2026-06-06)" so engineers
          # can see the push date at a glance; the date suffix is stripped in _deploy.yml
          # before the tag is used to pull the image.
          OPTIONS_JSON=$(echo "$BASE" | jq -c '["latest", "(build from source)"] + [.[] | "\(.tag) (\(.date))"]')

          echo "options_json=${OPTIONS_JSON}" >> $GITHUB_OUTPUT
          echo "new_tag=${NEW_TAG}" >> $GITHUB_OUTPUT

      - name: Patch image_tag input to type:choice in deploy workflows
        run: |
          # Write options to a temp file so yq can load them as a YAML sequence.
          echo '${{ steps.fetch_tags.outputs.options_json }}' > /tmp/opts.json

          # Avoid "key: value" patterns in the description — yq stores them as a YAML
          # mapping instead of a plain string, causing the GitHub UI to display JSON.
          DESCRIPTION="Pre-built image tag to deploy (defaults to latest)."

          for FILE in \
            .github/workflows/deploy-staging.yml \
            .github/workflows/deploy-production.yml; do
            yq -i '.on.workflow_dispatch.inputs.image_tag.type = "choice"' "$FILE"
            yq -i '.on.workflow_dispatch.inputs.image_tag.default = "latest"' "$FILE"
            yq -i '.on.workflow_dispatch.inputs.image_tag.options = load("/tmp/opts.json")' "$FILE"
            DESCRIPTION="$DESCRIPTION" yq -i '.on.workflow_dispatch.inputs.image_tag.description = env(DESCRIPTION)' "$FILE"
          done

      - name: Commit and push updated deploy workflows
        run: |
          git config user.name "power-tester-ci[bot]"
          git config user.email "power-tester-ci[bot]@users.noreply.github.com"
          git add \
            .github/workflows/deploy-staging.yml \
            .github/workflows/deploy-production.yml
          if git diff --staged --quiet; then
            echo "No changes — image_tag options already up to date."
          else
            git commit -m "chore: refresh deploy image_tag options [skip ci]"
            git push
          fi
