name: Build & Publish Docker Images

# Runs on every merge to main (after trunk-based delivery lands).
# Builds the production Docker images for server and client and pushes them
# to GitHub Container Registry (ghcr.io) so they can be used as pre-built
# artifacts for staging and production deploys.
#
# Image naming convention:
#   ghcr.io/<owner>/taskflow-server:<tag>
#   ghcr.io/<owner>/taskflow-client:<tag>
#
# Tags produced per build:
#   sha-<short-sha>  — immutable; use this tag when triggering a deploy
#   latest           — always points to the most recent main build
#
# After this workflow completes, copy the printed image tag and supply it as
# the "image_tag" input when manually dispatching deploy-staging.yml or
# deploy-production.yml to skip Railway's source build step.
#
# Note: GHCR packages must be set to public (or Railway must be granted
# registry access) for Railway to pull the image at deploy time.

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write # needed to push to ghcr.io

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag and registry owner
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT

      - name: Build & push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/taskflow-server:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/taskflow-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/client/Dockerfile
          target: production
          build-args: |
            VITE_APP_ENV=production
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/taskflow-client:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/taskflow-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          OWNER="${{ steps.meta.outputs.owner }}"
          TAG="${{ steps.meta.outputs.tag }}"
          echo "## Docker Images Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| \`ghcr.io/${OWNER}/taskflow-server\` | \`${TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`ghcr.io/${OWNER}/taskflow-client\` | \`${TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To deploy these images, dispatch **deploy-staging.yml** or **deploy-production.yml** with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "image_tag: ${TAG}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
