name: Deploy → ci

# Fires automatically on every merge to main (trunk-based delivery).
# Deploys to the Railway "ci" environment.
on:
  push:
    branches: [main]
  # Manual recovery path — see build-image.yml. Also useful to redeploy ci
  # without pushing, e.g. after a Railway-side failure.
  workflow_dispatch:

permissions:
  contents: read # actions/checkout inside the shared deploy workflow
  pull-requests: write # notify-pr comments on and labels the associated PR

jobs:
  deploy-ci:
    name: Deploy to ci
    # The deploy pipeline itself lives in power-tester/deploy-workflows; this
    # workflow only supplies the environment-specific inputs and the token.
    uses: power-tester/deploy-workflows/.github/workflows/deploy.yml@v1
    with:
      environment: ci
      railway_env: ci
      # server and client have no ordering relationship, so deploy them concurrently.
      max_parallel: 2
    secrets:
      # Set in GitHub → Settings → Environments → ci → Secrets
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
