name: List available images

# Run this before dispatching deploy-staging.yml or deploy-production.yml
# to see which pre-built image tags are available in GHCR.
#
# Usage:
#   Actions tab → "List available images" → Run workflow
#   Copy the desired tag from the job summary (e.g. sha-abc1234)
#   Paste it into the image_tag field when dispatching a deploy workflow

on:
  workflow_dispatch:

permissions:
  packages: read

jobs:
  list:
    name: List GHCR image tags
    runs-on: ubuntu-latest
    steps:
      - name: Fetch available tags
        id: tags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          fetch_tags() {
            local IMAGE="$1"
            # /users/{username}/packages/... is the correct endpoint for packages owned
            # by a specific user. /user/packages/... resolves to the token owner which
            # in GitHub Actions is the github-actions bot, not the repo owner — causing
            # 404/empty results. Works for public packages without extra auth.
            #
            # --fail-with-body makes curl exit non-zero on HTTP 4xx/5xx and print the
            # response body so the error is visible in the log rather than silently
            # treated as "no tags found".
            curl --fail-with-body -sS \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/${OWNER}/packages/container/${IMAGE}/versions?per_page=30" \
              | jq -r 'sort_by(.created_at) | reverse
                       | .[] | select(.metadata.container.tags | map(startswith("sha-")) | any)
                       | .metadata.container.tags[] | select(startswith("sha-")) as $tag
                       | "\($tag)  (pushed \(.created_at[0:10]))"' \
              || echo "(no tags found — has build-image.yml run yet?)"
          }

          print_section() {
            local IMAGE="$1"
            echo "### ${IMAGE} tags (newest first)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            fetch_tags "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          }

          print_section taskflow-server
          print_section taskflow-client

          echo "> **Next step:** copy a \`sha-\` tag above and paste it into the \`image_tag\` field when dispatching [Deploy → Staging](../deploy-staging.yml) or [Deploy → Production](../deploy-production.yml)." >> "$GITHUB_STEP_SUMMARY"
